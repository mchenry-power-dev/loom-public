<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title description">
<title id="title">Loom scheduling flow</title>
<desc id="description">Explicit delivery and time context enters calendar validation. Invalid requests receive explanatory feedback; valid proposals produce a schedule preview for merchant review. Constraints are not ordered. Eligibility is not authorization.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M1 1 L7 4 L1 7" fill="none" stroke="#526779" stroke-width="1.3"/>
</marker>
<marker id="back" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
<path d="M7 1 L1 4 L7 7" fill="none" stroke="#526779" stroke-width="1.3"/>
</marker>
</defs>
<rect width="1200" height="830" rx="16" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="40" y="52" fill="#172a3a" font-size="30" font-weight="650">Loom / Scheduling flow</text>
<text x="40" y="84" fill="#526779" font-size="18" font-weight="400">Calendar validation produces a proposal &#183; It does not execute billing or fulfillment</text>
<g data-box="40,160,300,180">
<rect x="40" y="160" width="300" height="180" rx="12" fill="white" stroke="#cbd6df"/>
<text x="60" y="191" fill="#172a3a" font-size="20" font-weight="600">Explicit context</text>
<text x="60" y="222" fill="#526779" font-size="17" font-weight="400">Requested delivery date</text>
<text x="60" y="245" fill="#526779" font-size="17" font-weight="400">Time and timezone context</text>
<text x="60" y="268" fill="#526779" font-size="17" font-weight="400">Purchase / delivery intent</text>
</g>
<g data-box="412,160,376,306">
<rect x="412" y="160" width="376" height="306" rx="12" fill="#eaf5f2" stroke="#cbd6df"/>
<text x="432" y="191" fill="#172a3a" font-size="20" font-weight="600">Calendar validation</text>
<text x="432" y="222" fill="#526779" font-size="17" font-weight="400">Lead-time constraints</text>
<text x="432" y="245" fill="#526779" font-size="17" font-weight="400">Cutoff constraints</text>
<text x="432" y="268" fill="#526779" font-size="17" font-weight="400">Blackout dates</text>
<text x="432" y="291" fill="#526779" font-size="17" font-weight="400">Horizon constraints</text>
<text x="432" y="314" fill="#526779" font-size="17" font-weight="400">Timezone interpretation</text>
</g>
<text x="432" y="440" fill="#526779" font-size="16" font-weight="400">Checks shown without precedence</text>
<path d="M340 250 H412" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arrow)"/>
<g data-box="860,160,300,122">
<rect x="860" y="160" width="300" height="122" rx="12" fill="#fff4df" stroke="#cbd6df"/>
<text x="880" y="191" fill="#172a3a" font-size="20" font-weight="600">Needs revision</text>
<text x="880" y="222" fill="#526779" font-size="17" font-weight="400">Explain validation issues</text>
<text x="880" y="245" fill="#526779" font-size="17" font-weight="400">Keep request editable</text>
</g>
<g data-box="860,344,300,122">
<rect x="860" y="344" width="300" height="122" rx="12" fill="#eaf5f2" stroke="#cbd6df"/>
<text x="880" y="375" fill="#172a3a" font-size="20" font-weight="600">Valid proposal</text>
<text x="880" y="406" fill="#526779" font-size="17" font-weight="400">Preview a proposed schedule</text>
<text x="880" y="429" fill="#526779" font-size="17" font-weight="400">No external side effect</text>
</g>
<path d="M788 250 H824 V221 H860" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M824 250 V405 H860" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arrow)"/>
<g data-box="860,530,300,108">
<rect x="860" y="530" width="300" height="108" rx="12" fill="white" stroke="#cbd6df"/>
<text x="880" y="561" fill="#172a3a" font-size="20" font-weight="600">Merchant review</text>
<text x="880" y="592" fill="#526779" font-size="17" font-weight="400">Review intent and evidence</text>
</g>
<path d="M1010 466 V530" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="530" width="748" height="108" rx="12" fill="white" stroke="#cbd6df"/>
<text x="62" y="564" fill="#172a3a" font-size="20" font-weight="400">Deterministic evaluation uses explicit inputs.</text>
<text x="62" y="593" fill="#172a3a" font-size="20" font-weight="400">A requested delivery date is not a billing date.</text>
<text x="62" y="622" fill="#172a3a" font-size="20" font-weight="400">Later actions need current evidence and separate controls.</text>
<rect x="40" y="680" width="1120" height="67" rx="12" fill="#fff4df" stroke="#cbd6df"/>
<text x="62" y="720" fill="#172a3a" font-size="20" font-weight="500">Fulfillment eligibility is not authorization. Operational handoff remains separately controlled.</text>
<text x="40" y="794" fill="#526779" font-size="16" font-weight="400">Conceptual flow &#183; No production policy constants or exact scheduling precedence disclosed</text>
</g>
</svg>
