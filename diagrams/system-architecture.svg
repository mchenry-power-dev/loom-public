<rect x="328" y="152" width="254" height="100" rx="12" fill="white" stroke="#cbd6df"/>
<text x="348" y="183" fill="#172a3a" font-size="20" font-weight="600">Embedded workspace</text>
<text x="348" y="214" fill="#526779" font-size="17" font-weight="400">Purchase-option extension</text>
</g>
<g data-box="616,152,254,100">
<rect x="616" y="152" width="254" height="100" rx="12" fill="#eaf5f2" stroke="#cbd6df"/>
<text x="636" y="183" fill="#172a3a" font-size="20" font-weight="600">Application services</text>
<text x="636" y="214" fill="#526779" font-size="17" font-weight="400">Configuration and review</text>
</g>
<g data-box="904,152,254,100">
<rect x="904" y="152" width="254" height="100" rx="12" fill="white" stroke="#cbd6df"/>
<text x="924" y="183" fill="#172a3a" font-size="20" font-weight="600">Shopify commerce APIs</text>
<text x="924" y="214" fill="#526779" font-size="17" font-weight="400">Authoritative commerce data</text>
</g>
