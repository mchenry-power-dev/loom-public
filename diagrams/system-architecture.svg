<text x="348" y="343" fill="#172a3a" font-size="20" font-weight="600">Purchase selector</text>
<text x="348" y="374" fill="#526779" font-size="17" font-weight="400">Option and first fulfillment</text>
</g>
<g data-box="616,312,254,100">
<rect x="616" y="312" width="254" height="100" rx="12" fill="white" stroke="#cbd6df"/>
<text x="636" y="343" fill="#172a3a" font-size="20" font-weight="600">Shopify checkout</text>
<text x="636" y="374" fill="#526779" font-size="17" font-weight="400">Checkout and initial payment</text>
</g>
<g data-box="904,312,254,100">
<rect x="904" y="312" width="254" height="100" rx="12" fill="#eaf5f2" stroke="#cbd6df"/>
<text x="924" y="343" fill="#172a3a" font-size="20" font-weight="600">Scheduling validation</text>
<text x="924" y="374" fill="#526779" font-size="17" font-weight="400">Preview is not execution</text>
</g>
