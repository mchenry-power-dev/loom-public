<path d="M582 202 H616" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M870 202 H904" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#back)"/>
<text x="40" y="292" fill="#14685f" font-size="15" font-weight="700">CUSTOMER PURCHASE AND SCHEDULE INTENT</text>
<g data-box="40,312,254,100">
<rect x="40" y="312" width="254" height="100" rx="12" fill="white" stroke="#cbd6df"/>
<text x="60" y="343" fill="#172a3a" font-size="20" font-weight="600">Customer on storefront</text>
