<rect x="40" y="472" width="254" height="100" rx="12" fill="white" stroke="#cbd6df"/>
<text x="60" y="503" fill="#172a3a" font-size="20" font-weight="600">Shopify lifecycle events</text>
</g>
<g data-box="328,472,254,100">
<rect x="328" y="472" width="254" height="100" rx="12" fill="white" stroke="#cbd6df"/>
<text x="348" y="503" fill="#172a3a" font-size="20" font-weight="600">Authenticated intake</text>
<text x="348" y="534" fill="#526779" font-size="17" font-weight="400">Accepted event evidence</text>
</g>
<g data-box="616,472,254,100">
<rect x="616" y="472" width="254" height="100" rx="12" fill="#eaf5f2" stroke="#cbd6df"/>
<text x="636" y="503" fill="#172a3a" font-size="20" font-weight="600">Durable work queue</text>
<text x="636" y="534" fill="#526779" font-size="17" font-weight="400">Recoverable work</text>
</g>
<g data-box="904,472,254,100">
<rect x="904" y="472" width="254" height="100" rx="12" fill="#eaf5f2" stroke="#cbd6df"/>
<text x="924" y="503" fill="#172a3a" font-size="20" font-weight="600">Worker</text>
<text x="924" y="534" fill="#526779" font-size="17" font-weight="400">Separate from web process</text>
</g>
<path d="M294 522 H328" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M582 522 H616" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M870 522 H904" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arrow)"/>
<g data-box="904,612,254,100">
<rect x="904" y="612" width="254" height="100" rx="12" fill="white" stroke="#cbd6df"/>
