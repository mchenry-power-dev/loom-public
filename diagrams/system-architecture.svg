<path d="M760 841 V889 H790" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="981" fill="#14685f" font-size="15" font-weight="700">SEPARATELY CONTROLLED HANDOFF &#183; PARTIAL / GATED</text>
<g data-box="40,1001,340,100">
<rect x="40" y="1001" width="340" height="100" rx="12" fill="#fff4df" stroke="#cbd6df"/>
<text x="60" y="1032" fill="#172a3a" font-size="20" font-weight="600">Separately authorized action</text>
<text x="60" y="1063" fill="#526779" font-size="17" font-weight="400">Eligibility alone is not authorization</text>
</g>
<g data-box="430,1001,340,100">
<rect x="430" y="1001" width="340" height="100" rx="12" fill="white" stroke="#cbd6df"/>
<text x="450" y="1032" fill="#172a3a" font-size="20" font-weight="600">Shopify fulfillment request</text>
<text x="450" y="1063" fill="#526779" font-size="17" font-weight="400">Request is not physical fulfillment</text>
</g>
<g data-box="820,1001,338,100">
<rect x="820" y="1001" width="338" height="100" rx="12" fill="white" stroke="#cbd6df"/>
<text x="840" y="1032" fill="#172a3a" font-size="20" font-weight="600">External provider decision</text>
<text x="840" y="1063" fill="#526779" font-size="17" font-weight="400">Provider retains its own decision</text>
</g>
<path d="M380 1051 H430" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M770 1051 H820" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="1144" fill="#526779" font-size="16" font-weight="400">Public abstraction &#183; No endpoints, identifiers, schema details, or operational recipes</text>
</g>
</svg>
