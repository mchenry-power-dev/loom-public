<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180" role="img" aria-labelledby="title description">
<title id="title">Loom system architecture</title>
<desc id="description">Merchant and storefront flows, authenticated lifecycle intake, durable worker processing and merchant review. Services and workers share relational persistence and support reporting and notification previews. A separately authorized fulfillment request leads to an external provider decision.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M1 1 L7 4 L1 7" fill="none" stroke="#526779" stroke-width="1.3"/>
</marker>
<marker id="back" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
<path d="M7 1 L1 4 L7 7" fill="none" stroke="#526779" stroke-width="1.3"/>
</marker>
</defs>
<rect width="1200" height="1180" rx="16" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="40" y="52" fill="#172a3a" font-size="30" font-weight="650">Loom / System architecture</text>
<text x="40" y="84" fill="#526779" font-size="18" font-weight="400">Conceptual responsibilities and boundaries &#183; Private pilot product</text>
<text x="40" y="132" fill="#14685f" font-size="15" font-weight="700">MERCHANT CONFIGURATION AND COMMERCE VISIBILITY</text>
<g data-box="40,152,254,100">
