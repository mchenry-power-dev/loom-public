<text x="924" y="674" fill="#526779" font-size="17" font-weight="400">Proposed operations</text>
</g>
<g data-box="616,612,254,100">
<rect x="616" y="612" width="254" height="100" rx="12" fill="white" stroke="#cbd6df"/>
<text x="636" y="643" fill="#172a3a" font-size="20" font-weight="600">Merchant review</text>
<text x="636" y="674" fill="#526779" font-size="17" font-weight="400">Evidence and eligibility</text>
</g>
<path d="M1031 572 V612" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M904 662 H870" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="639" fill="#526779" font-size="18" font-weight="400">Related evidence can arrive late or more than once.</text>
<text x="40" y="667" fill="#526779" font-size="18" font-weight="400">Incomplete evidence remains visible; it is not success.</text>
<text x="40" y="767" fill="#14685f" font-size="15" font-weight="700">SHARED STATE AND DERIVED VIEWS</text>
<g data-box="40,787,300,108">
<rect x="40" y="787" width="300" height="108" rx="12" fill="#eaf5f2" stroke="#cbd6df"/>
<text x="60" y="818" fill="#172a3a" font-size="20" font-weight="600">Application services</text>
<text x="60" y="844" fill="#172a3a" font-size="20" font-weight="600">+ worker</text>
</g>
<g data-box="392,787,342,108">
<rect x="392" y="787" width="342" height="108" rx="12" fill="white" stroke="#cbd6df"/>
<text x="412" y="818" fill="#172a3a" font-size="20" font-weight="600">Relational persistence</text>
<text x="412" y="849" fill="#526779" font-size="17" font-weight="400">Application state and work evidence</text>
</g>
<g data-box="790,776,368,65">
<rect x="790" y="776" width="368" height="65" rx="12" fill="white" stroke="#cbd6df"/>
<text x="810" y="807" fill="#172a3a" font-size="20" font-weight="600">Reporting</text>
